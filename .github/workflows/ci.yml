name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (incl. dev)
        run: pip install -e ".[dev]"

      - name: Rodar suite de testes
        run: pytest tests/ -q

      - name: Verificar contratos de camadas (import-linter)
        run: lint-imports --config tooling/import_linter_contracts.ini
