[project]
name = "ouroboros-engine"
version = "0.1.0"
description = "Engine hibrida, orientada a dados e Zero-GC no gameplay, para um Roguelite procedural e um Jogo Musical com pipeline de IA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
