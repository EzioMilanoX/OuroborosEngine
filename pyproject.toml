[project]
name = "ouroboros-engine"
version = "0.2.2"
description = "Engine hibrida, orientada a dados e Zero-GC no gameplay, provada por Roguelite, Jogo Musical (pipeline de IA), Platformer, Turn-based Tactics e Card Game"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pygame-ce>=2.5",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
