[project]
name = "ouroboros-engine"
version = "0.5.0"
description = "Engine hibrida, orientada a dados e Zero-GC no gameplay, provada por Roguelite, Jogo Musical (pipeline de IA), Platformer, Turn-based Tactics e Card Game"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pygame-ce>=2.5",
    "librosa>=0.10",
]

[project.optional-dependencies]
gl = [
    "moderngl>=5.10",
]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Regras fixadas: o ruff 0.16 ampliou o conjunto padrao (UP, I, RUF, B...) e o
# `ruff check .` sem configuracao passou a acusar ~600 avisos de estilo num codigo
# que nunca os seguiu. Estas sao as regras que eram o padrao antes (erros de
# sintaxe/import e pyflakes): pegam bug de verdade sem reescrever a engine inteira.
[tool.ruff]
target-version = "py311"
line-length = 125

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
