; Enforcement automatizado da Regra 2 da Constituicao (Separacao Logic vs
; Presentation). Rodar via `lint-imports` no CI/pre-commit -- ver
; https://import-linter.readthedocs.io/
;
; Falhar este contrato deve quebrar o build: a separacao entre logica de
; jogo e apresentacao nao pode depender apenas de convencao/docstring.

[importlinter]
root_package = ouroboros
include_external_packages = True

[importlinter:contract:1]
name = Nucleo, interfaces e produtos nao podem importar backends concretos
type = forbidden
source_modules =
    ouroboros.core
    ouroboros.interfaces
    ouroboros.roguelite
    ouroboros.rhythm
forbidden_modules =
    pygame
    godot

[importlinter:contract:2]
name = Apenas o CompositionRoot (dentro de bootstrap) pode importar backends concretos
type = forbidden
source_modules =
    ouroboros.bootstrap.engine_config
    ouroboros.bootstrap.game_loop
    ouroboros.bootstrap.audio_bank_loader
forbidden_modules =
    pygame
    godot

; Nota: ouroboros.bootstrap.composition_root e a UNICA excecao deliberada
; -- e o "composition root" que escolhe qual IRenderer/IInputProvider/
; IAudioEngine concreto instanciar (ver docstring de CompositionRoot).
; Ele importa de ouroboros.adapters.pygame_backend.*, que por sua vez
; importa pygame -- isso e esperado e nao e coberto por este contrato.

[importlinter:contract:3]
name = Camadas nao podem importar de volta para bootstrap (composicao e topo)
type = layers
layers =
    ouroboros.bootstrap
    ouroboros.adapters
    ouroboros.roguelite | ouroboros.rhythm
    ouroboros.interfaces
    ouroboros.core
